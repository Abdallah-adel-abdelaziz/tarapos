    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(defaultState));
        return Object.assign(JSON.parse(JSON.stringify(defaultState)), JSON.parse(raw));
      } catch (e) {
        return JSON.parse(JSON.stringify(defaultState));
      }
    }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    function R2(val) {
      return Math.round((Number(val) + Number.EPSILON) * 100) / 100;
    }

    function fmt(val) {
      return R2(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function todayStr() {
      return '2026-10-15';
    }

    function getCurrentRep() {
      if (state.activeUserId === 'ADMIN') return null;
      return state.reps.find(r => String(r.id) === String(state.activeUserId)) || null;
    }

    function getActiveWarehouseId() {
      const rep = getCurrentRep();
      return rep ? rep.warehouseId : 1;
    }

    function getAvailableStock(product, warehouseId) {
      const whId = warehouseId || getActiveWarehouseId();
      return (product.stockByWarehouse && product.stockByWarehouse[whId]) ? Number(product.stockByWarehouse[whId]) : 0;
    }

    function adjustStock(productId, warehouseId, deltaQty) {
      const prod = state.products.find(p => Number(p.id) === Number(productId));
      if (!prod) return false;
      if (!prod.stockByWarehouse) prod.stockByWarehouse = {};
      const current = Number(prod.stockByWarehouse[warehouseId] || 0);
      const next = current + Number(deltaQty);
      if (next < 0 && state.settings.blockZeroStock) return false;
      prod.stockByWarehouse[warehouseId] = Math.max(0, next);
      return true;
    }

    // حساب أرصدة الصندوق الرئيسية بدقة (نقدا / بطاقة / شيك)
    function computeSafeBalances(startDate, endDate) {
      let cash = 0, card = 0, check = 0;
      let periodIn = 0, periodOut = 0;

      state.cashTransactions.filter(t => t.status === 'ACTIVE').forEach(t => {
        const sign = t.type === 'IN' ? 1 : -1;
        const amt = R2(t.amount) * sign;
        if (t.payMethod === 'بطاقة') card = R2(card + amt);
        else if (t.payMethod === 'شيك') check = R2(check + amt);
        else cash = R2(cash + amt);

        if ((!startDate || t.date >= startDate) && (!endDate || t.date <= endDate)) {
          if (t.type === 'IN') periodIn = R2(periodIn + t.amount);
          else periodOut = R2(periodOut + t.amount);
        }
      });

      state.expenses.filter(e => e.status === 'ACTIVE').forEach(e => {
        const amt = R2(e.amount);
        if (e.payMethod === 'بطاقة') card = R2(card - amt);
        else if (e.payMethod === 'شيك') check = R2(check - amt);
        else cash = R2(cash - amt);

        if ((!startDate || e.date >= startDate) && (!endDate || e.date <= endDate)) {
          periodOut = R2(periodOut + amt);
        }
      });

      return {
        cash,
        card,
        check,
        totalSafe: R2(cash + card + check),
        periodNet: R2(periodIn - periodOut)
      };
    }

          <button onclick="clearAllPosSlots()" class="w-full py-3 rounded-xl bg-indigo-500 hover:bg-indigo-600 text-white font-bold shadow">
            تصفية جميع الشاشات
          </button>
        </div>
      `);
    }

    function selectPosSlot(slotKey) {
      state.activePosSlot = slotKey;
      saveState();
      closeModal();
      renderSalesScreen(document.getElementById('mainContainer'));
    }

    function clearAllPosSlots() {
      if (!confirm('هل تريد تفريغ جميع شاشات البيع (1 إلى 4) وعروض الأسعار؟')) return;
      [1, 2, 3, 4, 'QUOTE'].forEach(k => { state.posSlots[k].items = []; state.posSlots[k].discount = 0; });
      saveState();
      closeModal();
      renderSalesScreen(document.getElementById('mainContainer'));
    }

    function filterPosProducts(q) {
      const box = document.getElementById('posSearchResults');
      if (!q.trim()) { box.classList.add('hidden'); return; }
      const lower = q.trim().toLowerCase();
      const matches = state.products.filter(p =>
        p.name.toLowerCase().includes(lower) ||
        p.barcode.includes(lower) ||
        p.scientificName.toLowerCase().includes(lower)
      );
      if (matches.length === 0) {
        box.innerHTML = `<div class="p-3 text-xs text-gray-400">لا توجد نتائج مطابقة</div>`;
      } else {
        box.innerHTML = matches.map(p => `
          <div onclick="addProductToPos(${p.id}); document.getElementById('posSearchResults').classList.add('hidden');" class="p-2.5 hover:bg-emerald-50 cursor-pointer border-b flex justify-between items-center text-xs">
            <div>
              <div class="font-bold">${p.name}</div>
              <div class="text-[10px] text-gray-500">باركود: ${p.barcode} | المادة: ${p.scientificName}</div>
            </div>
            <div class="font-bold text-emerald-700">${fmt(p.sellPrice)} ${state.settings.currency} (المتاح: ${getAvailableStock(p)})</div>
          </div>
        `).join('');
      }
      box.classList.remove('hidden');
    }

    function addProductToPos(productId) {
      const slot = state.posSlots[state.activePosSlot];
      const prod = state.products.find(p => Number(p.id) === Number(productId));
      if (!prod) return;

      const whId = getActiveWarehouseId();
      const avail = getAvailableStock(prod, whId);
      const existing = slot.items.find(i => Number(i.productId) === Number(productId));
      const currentRequired = existing ? (existing.qty + (existing.bonus || 0) + 1) : 1;

      if (state.activePosSlot !== 'QUOTE' && state.settings.blockZeroStock && currentRequired > avail) {
        alert(`تنبيه مخزني: الرصيد المتاح من (${prod.name}) في المخزن الحالي هو (${avail}) فقط!`);
        return;
      }

      if (existing) {
        existing.qty += 1;
      } else {
        slot.items.push({
          productId: prod.id,
          name: prod.name,
          qty: 1,
          bonus: 0,
          price: prod.sellPrice,
          cost: prod.costPrice
        });
      }
      saveState();
      renderSalesScreen(document.getElementById('mainContainer'));
    }

    function updatePosItemPrice(idx, val) {
      const slot = state.posSlots[state.activePosSlot];
      const item = slot.items[idx];
      const newPrice = Math.max(0, Number(val) || 0);
      if (state.settings.preventSellBelowCost && newPrice < item.cost) {
        alert(`منع محاسبي: لا يُسمح بالبيع بأقل من سعر التكلفة (${fmt(item.cost)} ${state.settings.currency})!`);
        renderSalesScreen(document.getElementById('mainContainer'));
        return;
      }
      item.price = R2(newPrice);
      saveState();
      renderSalesScreen(document.getElementById('mainContainer'));
    }

    function updatePosItemQty(idx, val) {
      const slot = state.posSlots[state.activePosSlot];
      const item = slot.items[idx];
      const prod = state.products.find(p => Number(p.id) === Number(item.productId));
      const newQty = Math.max(1, parseInt(val) || 1);
      const avail = getAvailableStock(prod, getActiveWarehouseId());

      if (state.activePosSlot !== 'QUOTE' && state.settings.blockZeroStock && (newQty + (item.bonus || 0)) > avail) {
        alert(`الكمية المطلوبة مع البونص تتجاوز الرصيد المتاح (${avail})!`);
        renderSalesScreen(document.getElementById('mainContainer'));
        return;
      }
      item.qty = newQty;
      saveState();
      renderSalesScreen(document.getElementById('mainContainer'));
    }

    function updatePosItemBonus(idx, val) {
      const slot = state.posSlots[state.activePosSlot];
      const item = slot.items[idx];
      const prod = state.products.find(p => Number(p.id) === Number(item.productId));
      const newBonus = Math.max(0, parseInt(val) || 0);
      const avail = getAvailableStock(prod, getActiveWarehouseId());

      if (state.activePosSlot !== 'QUOTE' && state.settings.blockZeroStock && (item.qty + newBonus) > avail) {
        alert(`الكمية مع البونص تتجاوز الرصيد المتاح (${avail})!`);
        renderSalesScreen(document.getElementById('mainContainer'));
        return;
      }
      item.bonus = newBonus;
      saveState();
      renderSalesScreen(document.getElementById('mainContainer'));
    }

    function removePosItem(idx) {
      state.posSlots[state.activePosSlot].items.splice(idx, 1);
      saveState();
      renderSalesScreen(document.getElementById('mainContainer'));
    }

    function updatePosDiscount(val) {
      state.posSlots[state.activePosSlot].discount = Math.max(0, R2(val));
      saveState();
      renderSalesScreen(document.getElementById('mainContainer'));
    }

    function changePosClient(clientId) {
      state.posSlots[state.activePosSlot].clientId = Number(clientId);
      saveState();
      renderSalesScreen(document.getElementById('mainContainer'));
    }

    function changePosTax(taxId) {
      state.posSlots[state.activePosSlot].taxId = taxId;
      saveState();
      renderSalesScreen(document.getElementById('mainContainer'));
    }

    // نافذة إتمام الدفع وترحيل الفاتورة محاسبياً ومخزنياً
    function openCheckoutModal() {
      const slotKey = state.activePosSlot;
      const slot = state.posSlots[slotKey];
      if (slot.items.length === 0) { alert('الفاتورة فارغة!'); return; }

      let subtotal = 0;
      slot.items.forEach(i => subtotal = R2(subtotal + R2(i.qty * i.price)));
      const discount = R2(slot.discount || 0);
      const net = Math.max(0, R2(subtotal - discount));
      const taxObj = state.settings.taxes.find(t => t.id === slot.taxId);
      const taxRate = taxObj ? Number(taxObj.rate) : 0;
      const taxAmount = taxRate > 0
        ? (state.settings.priceIncludesTax ? R2(net - (net / (1 + taxRate / 100))) : R2(net * (taxRate / 100)))
        : 0;
      const grandTotal = state.settings.priceIncludesTax ? net : R2(net + taxAmount);

      openModal(`
        <div class="space-y-4 text-sm">
          <div class="flex justify-between items-center border-b pb-2">
            <h3 class="font-extrabold text-base text-emerald-800">اعتماد وترحيل الفاتورة (${slotKey === 'QUOTE' ? 'عرض سعر' : `شاشة ${slotKey}`})</h3>
            <button onclick="closeModal()">✕</button>
          </div>
          <div class="bg-emerald-50 p-3 rounded-xl space-y-1 text-xs">
            <div class="flex justify-between"><span>الإجمالي قبل الخصم:</span><strong>${fmt(subtotal)} ${state.settings.currency}</strong></div>
            <div class="flex justify-between"><span>الخصم:</span><strong>${fmt(discount)} ${state.settings.currency}</strong></div>
            <div class="flex justify-between"><span>الضريبة (${taxRate}%):</span><strong>${fmt(taxAmount)} ${state.settings.currency}</strong></div>
            <div class="flex justify-between text-base font-extrabold text-emerald-900 border-t pt-1"><span>الصافي المطلوب:</span><span>${fmt(grandTotal)} ${state.settings.currency}</span></div>
          </div>

          ${slotKey === 'QUOTE' ? `
            <p class="text-xs text-amber-800 bg-amber-50 p-2 rounded">سيتم حفظ هذا المستند كـ (عرض سعر) للعميل دون خصم من المخزن أو تأثير على الصندوق.</p>
          ` : `
            <div>
              <label class="block font-bold text-xs mb-1">طريقة الدفع:</label>
              <div class="grid grid-cols-4 gap-2 text-xs font-bold">
                ${['نقدا', 'آجل', 'بطاقة', 'شيك'].map(m => `
                  <label class="border rounded-lg p-2 text-center cursor-pointer bg-gray-50">
                    <input type="radio" name="checkoutPayMethod" value="${m}" ${m === 'نقدا' ? 'checked' : ''} onchange="onCheckoutMethodChange(this.value, ${grandTotal})" /> ${m}
                  </label>
                `).join('')}
              </div>
            </div>
            <div>
              <label class="block font-bold text-xs mb-1">المبلغ المدفوع الآن (والباقي يُرحل لذمم العميل تلقائياً):</label>
              <input id="checkoutPaidInput" type="number" step="0.01" value="${grandTotal}" class="w-full border-2 border-emerald-600 rounded-lg p-2 font-extrabold text-center text-lg" />
            </div>
          `}

          <div class="flex gap-2 pt-2">
            <button onclick="commitSalesInvoice(${grandTotal}, ${subtotal}, ${discount}, ${taxRate}, ${taxAmount}, true)" class="flex-1 bg-emerald-700 text-white font-bold py-2.5 rounded-xl">
              <i class="fa-solid fa-print"></i> حفظ وطباعة الفاتورة
            </button>
            <button onclick="commitSalesInvoice(${grandTotal}, ${subtotal}, ${discount}, ${taxRate}, ${taxAmount}, false)" class="flex-1 bg-gray-800 text-white font-bold py-2.5 rounded-xl">
              حفظ فقط
            </button>
          </div>
        </div>
      `);
    }

    function onCheckoutMethodChange(method, grandTotal) {
      const inp = document.getElementById('checkoutPaidInput');
      if (!inp) return;
      if (method === 'آجل') inp.value = 0;
      else inp.value = grandTotal;
    }

    function commitSalesInvoice(grandTotal, subtotal, discount, taxRate, taxAmount, shouldPrint) {
      const slotKey = state.activePosSlot;
      const slot = state.posSlots[slotKey];
      const rep = getCurrentRep();
      const whId = getActiveWarehouseId();
      const client = state.clients.find(c => Number(c.id) === Number(slot.clientId)) || state.clients[0];

      if (slotKey === 'QUOTE') {
        const quoteId = Date.now() % 100000;
        state.invoices.unshift({
          id: quoteId,
          number: `QUO-${quoteId}`,
          type: 'QUOTE',
          date: todayStr(),
          partyId: client.id,
          partyName: client.name,
          warehouseId: whId,
          repId: rep ? rep.id : 0,
          payMethod: 'عرض سعر',
          subtotal,
          discount,
          taxRate,
          taxAmount,
          grandTotal,
          paidAmount: 0,
          remainingAmount: 0,
          totalCost: 0,
          status: 'ACTIVE',
          items: JSON.parse(JSON.stringify(slot.items))
        });
        slot.items = [];
        slot.discount = 0;
        saveState();
        closeModal();
        alert('تم حفظ عرض السعر بنجاح في سجل عروض الأسعار!');
        renderSalesScreen(document.getElementById('mainContainer'));
        return;
      }

      const methodRadio = document.querySelector('input[name="checkoutPayMethod"]:checked');
      const payMethod = methodRadio ? methodRadio.value : 'نقدا';
      const paidInput = document.getElementById('checkoutPaidInput');
      const paidAmount = Math.min(grandTotal, Math.max(0, R2(paidInput ? paidInput.value : grandTotal)));
      const remainingAmount = R2(grandTotal - paidAmount);

      if (remainingAmount > 0 && (!state.settings.allowCreditSale || (rep && !rep.permissions.canCreditSale))) {
        alert('عفواً، البيع الآجل غير مسموح به حسب إعدادات النظام أو صلاحيات المندوب!');
        return;
      }

      // 1. خصم الكميات المباعة + كميات البونص من المخزن وحساب التكلفة الحقيقية (COGS)
      let totalCost = 0;
      for (const it of slot.items) {
        const totalUnits = Number(it.qty) + Number(it.bonus || 0);
        adjustStock(it.productId, whId, -totalUnits);
        totalCost = R2(totalCost + R2(totalUnits * Number(it.cost)));
      }

      // 2. تحديث مديونية العميل بالمتبقي فقط
      if (remainingAmount > 0) {
        client.balance = R2(client.balance + remainingAmount);
      }

      // 3. تحديث الصندوق أو عهدة المندوب بالمدفوع الفعلي فقط دون مضاعفة
      const invId = (state.invoices.length > 0 ? Math.max(...state.invoices.map(i => i.id)) : 1000) + 1;
      const invNumber = `INV-${invId}`;

      if (paidAmount > 0) {
        if (rep) {
          rep.cashCustody = R2(rep.cashCustody + paidAmount);
        } else {
          state.cashTransactions.unshift({
            id: Date.now() % 100000,
            date: todayStr(),
            type: 'IN',
            payMethod,
            amount: paidAmount,
            category: 'مبيعات',
            partyName: client.name,
            notes: `تحصيل فاتورة مبيعات ${invNumber}`,
            repId: null,
            status: 'ACTIVE'
          });
        }
      }

      const newInvoice = {
        id: invId,
        number: invNumber,
        type: 'SALE',
        date: todayStr(),
        partyId: client.id,
        partyName: client.name,
        warehouseId: whId,
        repId: rep ? rep.id : 0,
        payMethod: remainingAmount > 0 && paidAmount === 0 ? 'آجل' : payMethod,
        subtotal,
        discount,
        taxRate,
        taxAmount,
        grandTotal,
        paidAmount,
        remainingAmount,
        totalCost,
        status: 'ACTIVE',
        items: JSON.parse(JSON.stringify(slot.items))
      };

      state.invoices.unshift(newInvoice);
      slot.items = [];
      slot.discount = 0;
      saveState();
      closeModal();

      if (shouldPrint) {
        printInvoiceReceipt(newInvoice, client);
      } else {
        alert(`تم حفظ الفاتورة رقم ${invNumber} بنجاح!`);
        renderSalesScreen(document.getElementById('mainContainer'));
      }
    }

                tempPurchaseItems.map((it, idx) => `

                  </tr>
                `).join('')}

          <div class="flex justify-between items-center pt-2 border-t">
            <div class="text-lg font-extrabold text-blue-900">إجمالي المشتريات: ${fmt(total)} ${state.settings.currency}</div>
            <button onclick="savePurchaseInvoice(${total})" class="bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-xl text-sm shadow">

            </button>

    function addPurchaseLine() {
      const prodId = Number(document.getElementById('purchProdSelect').value);
      const qty = Math.max(1, parseInt(document.getElementById('purchQtyInput').value) || 1);
      const customCost = parseFloat(document.getElementById('purchCostInput').value);
      const prod = state.products.find(p => p.id === prodId);
      if (!prod) return;
      const cost = !isNaN(customCost) && customCost > 0 ? R2(customCost) : prod.costPrice;
      tempPurchaseItems.push({ productId: prod.id, name: prod.name, qty, cost, price: cost, bonus: 0 });
      renderPurchasesScreen(document.getElementById('mainContainer'));
    }

    function savePurchaseInvoice(total) {
      if (tempPurchaseItems.length === 0) { alert('أضف أصنافاً أولاً!'); return; }
      const suppId = Number(document.getElementById('purchSupplierId').value);
      const supplier = state.suppliers.find(s => s.id === suppId);
      const payMethod = document.getElementById('purchPayMethod').value;
      const date = document.getElementById('purchDate').value || todayStr();

      // زيادة المخزن الرئيسي وتحديث سعر التكلفة
      tempPurchaseItems.forEach(it => {
        adjustStock(it.productId, 1, it.qty);
        const prod = state.products.find(p => p.id === it.productId);
        if (prod) prod.costPrice = it.cost;
      });

      const paidAmount = payMethod === 'آجل' ? 0 : total;
      const remainingAmount = R2(total - paidAmount);

      if (remainingAmount > 0 && supplier) {
        supplier.balance = R2(supplier.balance + remainingAmount);
      }

      const invId = (state.invoices.length > 0 ? Math.max(...state.invoices.map(i => i.id)) : 1000) + 1;
      const invNumber = `PUR-${invId}`;

      if (paidAmount > 0) {
        state.cashTransactions.unshift({
          id: Date.now() % 100000,
          date,
          type: 'OUT',
          payMethod,
          amount: paidAmount,
          category: 'مشتريات',
          partyName: supplier ? supplier.name : 'مورد',
          notes: `سداد فاتورة مشتريات ${invNumber}`,
          repId: null,
          status: 'ACTIVE'
        });
      }

      state.invoices.unshift({
        id: invId,
        number: invNumber,
        type: 'PURCHASE',
        date,
        partyId: supplier.id,
        partyName: supplier.name,
        warehouseId: 1,
        repId: 0,
        payMethod,
        subtotal: total,
        discount: 0,
        taxRate: 0,
        taxAmount: 0,
        grandTotal: total,
        paidAmount,
        remainingAmount,
        totalCost: total,
        status: 'ACTIVE',
        items: JSON.parse(JSON.stringify(tempPurchaseItems))
      });

      tempPurchaseItems = [];
      saveState();
      alert(`تم حفظ فاتورة المشتريات ${invNumber} وإضافة الكميات للمخزن الرئيسي!`);
      renderPurchasesScreen(document.getElementById('mainContainer'));
    }

    function commitClientReceipt(clientId) {
      const client = state.clients.find(c => c.id === clientId);
      const amt = R2(document.getElementById('recAmount').value || 0);
      const method = document.getElementById('recMethod').value;
      const notes = document.getElementById('recNotes').value || 'سند قبض من عميل';
      if (amt <= 0) return;

      client.balance = R2(client.balance - amt);
      const rep = getCurrentRep();
      if (rep) {
        rep.cashCustody = R2(rep.cashCustody + amt);
      } else {
        state.cashTransactions.unshift({
          id: Date.now() % 100000,
          date: todayStr(),
          type: 'IN',
          payMethod: method,
          amount: amt,
          category: 'سند قبض عميل',

          repId: null,
          status: 'ACTIVE'

    function saveNewProduct() {
      const name = document.getElementById('npName').value.trim();
      if (!name) return;
      const id = Math.max(...state.products.map(p => p.id), 100) + 1;
      const qty = parseInt(document.getElementById('npQty').value) || 0;
      state.products.push({
        id,
        barcode: document.getElementById('npBarcode').value || String(6221000 + id),
        name,
        scientificName: document.getElementById('npSci').value || name,
        category: document.getElementById('npCat').value,
        unit: 'عبوة',
        costPrice: R2(document.getElementById('npCost').value || 0),
        sellPrice: R2(document.getElementById('npSell').value || 0),
        wholesalePrice: R2(document.getElementById('npSell').value || 0),
        minStock: 10,
        expiryDate: document.getElementById('npExp').value || '2027-12-31',
        stockByWarehouse: { 1: qty }
      });
      saveState();
      closeModal();
      renderInventoryScreen(document.getElementById('mainContainer'));
    }

      const cat = prompt('اكتب اسم التصنيف الجديد:');

        saveState();
        alert('تمت إضافة التصنيف بنجاح!');

    function openBulkPriceModal() {
      const pct = parseFloat(prompt('أدخل نسبة زيادة أو تخفيض أسعار البيع لجميع الأصناف (مثال: 5 لزيادة 5%):', '5'));
      if (isNaN(pct) || pct === 0) return;
      state.products.forEach(p => {
        p.sellPrice = R2(p.sellPrice * (1 + pct / 100));
      });
      saveState();
      renderInventoryScreen(document.getElementById('mainContainer'));
    }

    function exportInventoryCsv() {

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

    // شاشة "عرض حركة المتجر" المطابقة للصور 25 و 26 و 27 و 28
    function openStoreMovementReport() {
      const start = document.getElementById('repStartDate')?.value || '2026-10-01';
      const end = document.getElementById('repEndDate')?.value || todayStr();
      const safe = computeSafeBalances(start, end);

      const sales = state.invoices.filter(i => i.type === 'SALE' && i.status === 'ACTIVE' && i.date >= start && i.date <= end);
      const saleReturns = state.invoices.filter(i => i.type === 'SALE_RETURN' && i.status === 'ACTIVE' && i.date >= start && i.date <= end);
      const purchases = state.invoices.filter(i => i.type === 'PURCHASE' && i.status === 'ACTIVE' && i.date >= start && i.date <= end);
      const purchaseReturns = state.invoices.filter(i => i.type === 'PURCHASE_RETURN' && i.status === 'ACTIVE' && i.date >= start && i.date <= end);
      const exps = state.expenses.filter(e => e.status === 'ACTIVE' && e.date >= start && e.date <= end);

      const sumBy = (arr, fn) => R2(arr.reduce((s, x) => s + fn(x), 0));

      const totalSales = sumBy(sales, i => i.grandTotal);
      const salesCash = sumBy(sales.filter(i => i.payMethod === 'نقدا'), i => i.paidAmount);
      const salesCredit = sumBy(sales, i => i.remainingAmount);
      const salesCard = sumBy(sales.filter(i => i.payMethod === 'بطاقة'), i => i.paidAmount);
      const salesCheck = sumBy(sales.filter(i => i.payMethod === 'شيك'), i => i.paidAmount);
      const totalSaleReturn = sumBy(saleReturns, i => i.grandTotal);
      const totalDiscounts = sumBy(sales, i => i.discount);
      const totalTaxes = sumBy(sales, i => i.taxAmount);

      const grossProfit = sumBy(sales, i => R2(i.grandTotal - i.taxAmount - i.totalCost)) - sumBy(saleReturns, i => R2(i.grandTotal - i.totalCost));
      const totalExpenses = sumBy(exps, e => e.amount);
      const netProfitAfterExp = R2(grossProfit - totalExpenses);

      const totalPurchases = sumBy(purchases, i => i.grandTotal);
      const purchCash = sumBy(purchases.filter(i => i.payMethod === 'نقدا'), i => i.paidAmount);
      const purchCredit = sumBy(purchases, i => i.remainingAmount);
      const totalPurchReturn = sumBy(purchaseReturns, i => i.grandTotal);

      const rowHtml = (label, val, highlight = false) => `
        <div class="flex justify-between items-center py-2 px-3 border-b ${highlight ? 'bg-emerald-50 font-extrabold text-emerald-900' : ''}">
          <span>${label}</span>
          <span class="font-bold">${fmt(val)}</span>
        </div>
      `;

      openModal(`
        <div class="space-y-2 text-xs">
          <div class="flex justify-between items-center border-b pb-2">
            <h3 class="font-extrabold text-base text-teal-900">عرض حركة المتجر (${start} إلى ${end})</h3>
            <button onclick="closeModal()">✕</button>
          </div>
          <div class="border rounded-xl overflow-hidden divide-y">
            ${rowHtml('الرصيد في الصندوق', safe.totalSafe, true)}
            ${rowHtml('الرصيد في الصندوق خلال الفترة', safe.periodNet)}
            <div class="bg-gray-200 font-extrabold p-2 text-center">المبيعات والأرباح</div>
            ${rowHtml('إجمالي المبيعات', totalSales, true)}
            ${rowHtml('إجمالي المبيعات نقداً', salesCash)}
            ${rowHtml('إجمالي المبيعات آجل', salesCredit)}
            ${rowHtml('إجمالي المبيعات (بطاقة)', salesCard)}
            ${rowHtml('إجمالي المبيعات (شيك)', salesCheck)}
            ${rowHtml('إجمالي المرتجع مبيعات', totalSaleReturn)}
            ${rowHtml('إجمالي الخصومات', totalDiscounts)}
            ${rowHtml('إجمالي الضرائب', totalTaxes)}
            ${rowHtml('إجمالي المتبقي عند العملاء', state.clients.reduce((s, c) => R2(s + c.balance), 0))}
            ${rowHtml('إجمالي الأرباح', grossProfit, true)}
            ${rowHtml('إجمالي الأرباح بعد خصم المصروفات', netProfitAfterExp, true)}
            <div class="bg-gray-200 font-extrabold p-2 text-center">المشتريات والمصروفات</div>
            ${rowHtml('إجمالي المشتريات', totalPurchases, true)}
            ${rowHtml('إجمالي المشتريات نقداً', purchCash)}
            ${rowHtml('إجمالي المشتريات آجل', purchCredit)}
            ${rowHtml('إجمالي مرتجع المشتريات', totalPurchReturn)}
            ${rowHtml('إجمالي المتبقي للموردين', state.suppliers.reduce((s, x) => R2(s + x.balance), 0))}
            ${rowHtml('إجمالي المصروفات', totalExpenses, true)}
          </div>
        </div>
      `);
    }

    // الرسم البياني لحركة المتجر (مطابق للصورة 23)
    function openStoreChartModal() {
      const safe = computeSafeBalances();
      const sales = state.invoices.filter(i => i.type === 'SALE' && i.status === 'ACTIVE').reduce((s, i) => R2(s + i.grandTotal), 0);
      const purchases = state.invoices.filter(i => i.type === 'PURCHASE' && i.status === 'ACTIVE').reduce((s, i) => R2(s + i.grandTotal), 0);
      const sRet = state.invoices.filter(i => i.type === 'SALE_RETURN' && i.status === 'ACTIVE').reduce((s, i) => R2(s + i.grandTotal), 0);
      const pRet = state.invoices.filter(i => i.type === 'PURCHASE_RETURN' && i.status === 'ACTIVE').reduce((s, i) => R2(s + i.grandTotal), 0);
      const exp = state.expenses.filter(e => e.status === 'ACTIVE').reduce((s, e) => R2(s + e.amount), 0);
      const profit = state.invoices.filter(i => i.type === 'SALE' && i.status === 'ACTIVE').reduce((s, i) => R2(s + (i.grandTotal - i.totalCost)), 0) - exp;

      const items = [
        { label: 'الصندوق', val: safe.totalSafe, color: 'bg-cyan-500' },
        { label: 'المبيعات', val: sales, color: 'bg-emerald-600' },
        { label: 'المشتريات', val: purchases, color: 'bg-blue-600' },
        { label: 'م. مبيعات', val: sRet, color: 'bg-amber-500' },
        { label: 'م. مشتريات', val: pRet, color: 'bg-purple-500' },
        { label: 'المصروفات', val: exp, color: 'bg-rose-600' },
        { label: 'الأرباح', val: profit, color: 'bg-teal-700' }
      ];
      const maxVal = Math.max(...items.map(i => Math.abs(i.val)), 100);

      openModal(`
        <div class="space-y-4 text-xs">
          <div class="flex justify-between items-center border-b pb-2">

          </div>

            ${items.map(it => {
              const hPct = Math.min(100, Math.max(8, Math.round((Math.abs(it.val) / maxVal) * 100)));
              return `
                <div class="flex flex-col items-center flex-1 h-full justify-end">
                  <span class="text-[10px] font-bold mb-1">${fmt(it.val)}</span>
                  <div class="w-full max-w-[38px] ${it.color} rounded-t-lg transition-all" style="height: ${hPct}%"></div>
                  <span class="text-[11px] font-bold mt-2 text-gray-700">${it.label}</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `);
    }

      `);

    function runInvoiceFilter(invType) {
      const q = (document.getElementById('fltInvQuery')?.value || '').trim();
      const allowCash = document.getElementById('chkCash')?.checked;
      const allowCredit = document.getElementById('chkCredit')?.checked;
      const allowCard = document.getElementById('chkCard')?.checked;
      const allowCheck = document.getElementById('chkCheck')?.checked;

      const list = state.invoices.filter(i => {
        if (i.type !== invType) return false;
        if (q && !i.number.includes(q) && !i.partyName.includes(q)) return false;
        if (invType === 'QUOTE') return true;
        if (i.payMethod === 'نقدا' && !allowCash) return false;
        if (i.payMethod === 'آجل' && !allowCredit) return false;
        if (i.payMethod === 'بطاقة' && !allowCard) return false;
        if (i.payMethod === 'شيك' && !allowCheck) return false;
        return true;
      });

      const box = document.getElementById('filteredInvoicesResult');
      if (list.length === 0) {
        box.innerHTML = `<div class="p-4 text-center text-gray-400">لا توجد فواتير مطابقة</div>`;
        return;
      }
      box.innerHTML = list.map(i => `
        <div class="p-2.5 flex justify-between items-center ${i.status === 'CANCELLED' ? 'bg-red-50 line-through' : ''}">
          <div>
            <div class="font-bold">${i.number} - ${i.partyName} (${i.payMethod})</div>
            <div class="text-[10px] text-gray-500">التاريخ: ${i.date} | المدفوع: ${fmt(i.paidAmount)} \vert{} الباقي: ${fmt(i.remainingAmount)}</div>
          </div>
          <div class="font-extrabold text-emerald-800">${fmt(i.grandTotal)}</div>
        </div>
      `).join('');
    }

      openModal(`

            <h3 class="font-extrabold text-sm text-emerald-800">تقرير بالمبيعات والأرباح حسب رقم الفاتورة والعميل</h3>

          <div class="max-h-80 overflow-y-auto border rounded">

              </thead>
              <tbody class="divide-y">

                    <tr>
                      <td class="p-2 font-bold">${i.number}</td>
                      <td class="p-2">${i.partyName}</td>
                      <td class="p-2">${fmt(netRev)}</td>
                      <td class="p-2 text-gray-600">${fmt(i.totalCost)}</td>
                      <td class="p-2 font-extrabold ${prof >= 0 ? 'text-emerald-700' : 'text-red-600'}">${fmt(prof)}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `);
    }

    // 1. كشف حساب عميل أو مورد تفصيلي (مطابق تماماً للصورة 3: MPOSPDFexprpt9)
    function generatePartyStatementPDF(partyType, partyId) {
      const isClient = partyType === 'CLIENT';
      const party = (isClient ? state.clients : state.suppliers).find(p => p.id === partyId);
      if (!party) return;

      const rows = [];
      let running = R2(party.openingBalance || 0);
      let totalDebit = running > 0 ? running : 0;
      let totalCredit = running < 0 ? Math.abs(running) : 0;

      if (running !== 0) {
        rows.push({ idx: 1, date: '2026-10-01', credit: running < 0 ? Math.abs(running) : 0, debit: running > 0 ? running : 0, bal: running, desc: 'رصيد سابق / افتتاحي' });
      }

      const partyInvoices = state.invoices.filter(i => i.partyId === party.id && i.status === 'ACTIVE');
      partyInvoices.forEach(inv => {
        if (isClient && inv.type === 'SALE') {
          running = R2(running + inv.remainingAmount);
          totalDebit = R2(totalDebit + inv.grandTotal);
          totalCredit = R2(totalCredit + inv.paidAmount);
          rows.push({ idx: rows.length + 1, date: inv.date, credit: inv.paidAmount, debit: inv.grandTotal, bal: running, desc: `فاتورة مبيعات ${inv.number}` });
        } else if (!isClient && inv.type === 'PURCHASE') {
          running = R2(running + inv.remainingAmount);
          totalCredit = R2(totalCredit + inv.grandTotal);
          totalDebit = R2(totalDebit + inv.paidAmount);
          rows.push({ idx: rows.length + 1, date: inv.date, credit: inv.grandTotal, debit: inv.paidAmount, bal: running, desc: `فاتورة مشتريات ${inv.number}` });
        }
      });

      const html = `
        <div class="font-bold mb-2">اسم ${isClient ? 'العميل' : 'المورد'} : ${party.name}</div>
        <table class="w-full text-center border-collapse border border-gray-800 text-xs">
          <thead class="bg
